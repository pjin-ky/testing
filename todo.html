<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투두리스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; padding: 2rem 1rem; }
    .wrap { max-width: 900px; margin: 0 auto; }
    .date-header { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1.5px solid #e0ddd5; }
    .date-header h1 { font-size: 26px; font-weight: 600; color: #1a1a1a; }
    .date-header p { font-size: 14px; color: #888; margin-top: 4px; }
    .table-wrap { background: #fff; border: 1px solid #e8e5de; border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; }
    th { background: #fde8ef; color: #c2637a; font-weight: 500; font-size: 13px; padding: 12px 14px; text-align: left; border-bottom: 1px solid #e8e5de; }
    td { padding: 12px 14px; border-bottom: 1px solid #f0ede6; color: #1a1a1a; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafaf7; }
    tr.done td { color: #bbb; }
    tr.done .task-name { text-decoration: line-through; color: #bbb; }
    .col-no { width: 48px; }
    .col-chk { width: 40px; text-align: center; }
    .col-due { width: 110px; }
    .col-task { width: 20%; }
    .col-detail { width: auto; }
    .col-note { width: 110px; }
    input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #3b82f6; }
    .badge { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 6px; font-weight: 500; }
    .badge-urgent { background: #fee2e2; color: #991b1b; }
    .badge-done   { background: #dcfce7; color: #166534; }
    .badge-normal { background: #dbeafe; color: #1e40af; }
    .del-btn { font-size: 11px; padding: 2px 8px; border-radius: 6px; border: 1px solid #e0ddd5; background: transparent; color: #aaa; cursor: pointer; margin-left: 4px; }
    .del-btn:hover { color: #dc2626; border-color: #fca5a5; }
    .actions { display: flex; gap: 4px; align-items: center; }
    .add-btn { margin-top: 1rem; padding: 9px 18px; font-size: 13px; border-radius: 8px; border: 1px solid #d1cfc8; background: #fff; color: #444; cursor: pointer; }
    .add-btn:hover { background: #f5f5f0; }
    .input-row input, .input-row select { width: 100%; font-size: 13px; padding: 5px 8px; border: 1px solid #d1cfc8; border-radius: 6px; background: #fff; color: #1a1a1a; }
    .save-btn { font-size: 12px; padding: 5px 12px; border-radius: 6px; border: 1px solid #93c5fd; background: #eff6ff; color: #1e40af; cursor: pointer; white-space: nowrap; }
    .save-btn:hover { background: #dbeafe; }
    .no-col { color: #aaa; font-size: 13px; }
    .due-col { font-size: 13px; color: #666; }
    .detail-col { color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="date-header">
      <h1 id="today-date"></h1>
      <p id="today-day"></p>
    </div>

    <div class="table-wrap">
      <table id="todo-table">
        <colgroup>
          <col class="col-no">
          <col class="col-chk">
          <col class="col-due">
          <col class="col-task">
          <col class="col-detail">
          <col class="col-note">
        </colgroup>
        <thead>
          <tr>
            <th>순서</th>
            <th></th>
            <th>마감일</th>
            <th>업무명</th>
            <th>상세 내용</th>
            <th>비고</th>
          </tr>
        </thead>
        <tbody id="todo-body"></tbody>
      </table>
    </div>

    <button class="add-btn" onclick="showAddRow()">+ 항목 추가</button>
  </div>

  <script>
    const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
    document.getElementById('today-date').textContent = `${y}년 ${m}월 ${d}일`;
    document.getElementById('today-day').textContent = `${days[now.getDay()]} — 오늘의 할 일`;

    let todos = [
      { id:1, due:'2026-04-14', task:'주간 보고서 작성', detail:'팀장님께 금요일까지 제출', note:'긴급', done:false },
      { id:2, due:'2026-04-15', task:'서버 점검', detail:'야간 점검 일정 확인 및 공지', note:'일반', done:false },
      { id:3, due:'2026-04-12', task:'파워셸 공부', detail:'기본 명령어 실습 완료', note:'완료', done:true },
    ];
    let nextId = 4;
    let addRowVisible = false;

    function badgeHtml(note) {
      if (note === '긴급') return `<span class="badge badge-urgent">긴급</span>`;
      if (note === '완료') return `<span class="badge badge-done">완료</span>`;
      return `<span class="badge badge-normal">${note || '일반'}</span>`;
    }

    function render() {
      const tbody = document.getElementById('todo-body');
      tbody.innerHTML = '';
      todos.forEach((t, i) => {
        const tr = document.createElement('tr');
        if (t.done) tr.classList.add('done');
        tr.innerHTML = `
          <td class="no-col">${i+1}</td>
          <td style="text-align:center;"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${t.id})"></td>
          <td class="due-col">${t.due}</td>
          <td class="task-name" style="font-weight:500;">${t.task}</td>
          <td class="detail-col">${t.detail}</td>
          <td><div class="actions">${badgeHtml(t.note)}<button class="del-btn" onclick="deleteTodo(${t.id})">삭제</button></div></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggle(id) {
      const t = todos.find(x => x.id === id);
      if (t) t.done = !t.done;
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter(x => x.id !== id);
      render();
    }

    function showAddRow() {
      if (addRowVisible) return;
      addRowVisible = true;
      const tbody = document.getElementById('todo-body');
      const tr = document.createElement('tr');
      tr.id = 'input-row';
      tr.innerHTML = `
        <td></td>
        <td></td>
        <td><input type="date" id="new-due"></td>
        <td><input type="text" id="new-task" placeholder="업무명"></td>
        <td><input type="text" id="new-detail" placeholder="상세 내용"></td>
        <td><div class="actions">
          <select id="new-note">
            <option>일반</option>
            <option>긴급</option>
            <option>완료</option>
          </select>
          <button class="save-btn" onclick="saveRow()">저장</button>
        </div></td>
      `;
      tbody.appendChild(tr);
    }

    function saveRow() {
      const due = document.getElementById('new-due').value;
      const task = document.getElementById('new-task').value.trim();
      const detail = document.getElementById('new-detail').value.trim();
      const note = document.getElementById('new-note').value;
      if (!task) { alert('업무명을 입력해주세요'); return; }
      todos.push({ id: nextId++, due, task, detail, note, done: false });
      addRowVisible = false;
      render();
    }

    render();
  </script>
</body>
</html>
